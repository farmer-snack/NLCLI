name: Build (Fork)

# fork 专用构建流程：只编译、只上传 artifact，不签名、不发布。
# 官方 build_release.yml 依赖 ClassIsland 组织内的私有 secrets，在 fork 中不会运行。

on:
  push:
    branches: ['**']
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_SDK_VERSION: 10.0.302
  APP_DISPLAY_VERSION: 2.1.1.1

jobs:
  desktop:
    name: Desktop_${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: win-x64
            rid: win-x64
            platform: x64
          - os: ubuntu-24.04
            name: linux-x64
            rid: linux-x64
            platform: x64
          - os: macos-26
            name: osx-arm64
            rid: osx-arm64
            platform: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Pin .NET SDK
        shell: bash
        run: |
          set -euo pipefail
          dotnet new globaljson --sdk-version "$DOTNET_SDK_VERSION" --roll-forward disable --force
          dotnet --version

      - name: Install macOS workload
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)/Contents/Developer"
          xcodebuild -version
          dotnet workload install macos --version "$DOTNET_SDK_VERSION"

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish ClassIsland.Desktop/ClassIsland.Desktop.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:ClassIsland_SelfContained=true \
            -p:ClassIsland_PlatformTarget=${{ matrix.platform }} \
            -p:ApplicationVersion=${{ github.run_number }} \
            -p:ApplicationDisplayVersion=${{ env.APP_DISPLAY_VERSION }} \
            -o "out/${{ matrix.name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassIsland-${{ matrix.name }}
          path: out/${{ matrix.name }}/**
          if-no-files-found: error

  android:
    name: Android_arm64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Pin .NET SDK
        shell: bash
        run: |
          set -euo pipefail
          dotnet new globaljson --sdk-version "$DOTNET_SDK_VERSION" --roll-forward disable --force
          dotnet --version

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android workload
        run: dotnet workload install android --version "$DOTNET_SDK_VERSION"

      - name: Prepare debug keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Publish APK
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish ClassIsland.Android/ClassIsland.Android.csproj \
            -c Release \
            -f net10.0-android \
            -p:AndroidPackageFormat=apk \
            -p:BrandType=Beta \
            -p:ApplicationVersion=${{ github.run_number }} \
            -p:ApplicationDisplayVersion=${{ env.APP_DISPLAY_VERSION }} \
            -o out/android

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find out/android -maxdepth 1 -type f -name '*-Signed.apk' -print -quit)"
          test -n "$APK_PATH"
          AAPT_PATH="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          "$AAPT_PATH" dump badging "$APK_PATH" | grep -E "^package|^sdkVersion|^targetSdkVersion|^native-code"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClassIsland-android-arm64
          path: out/android/*.apk
          if-no-files-found: error
